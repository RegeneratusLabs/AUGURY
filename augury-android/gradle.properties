org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Compile Kotlin in the Gradle daemon rather than a separate Kotlin daemon.
# The Kotlin daemon hardcodes ~/.local/share/kotlin/daemon for its client
# markers, which is on a read-only mount in this sandbox: it fails to connect and
# Gradle only recovers via a silent in-process fallback. Choosing in-process
# explicitly makes the build deterministic instead of lucky.
kotlin.compiler.execution.strategy=in-process
